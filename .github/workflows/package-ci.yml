name: "Package CI"

permissions:
  statuses: write
  checks: write
  contents: read

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"
      - name: Restore Node.js dependencies
        run: yarn install --immutable
      - name: Audit dependencies
        # Accepted exception: npm 1243505 / GHSA-gcqx-w48m-w2h4 (deepmerge).
        # Only Expo/RN config and CLI checks in private development apps; no upstream fix.
        # Owner: @roncohen. Accepted: 2026-11-06. Review by: 2027-02-04, or when a fix ships.
        # audit:ci ignores this advisory only; unfiltered audits still report it.
        run: yarn audit:ci
      - name: Restore package.json
        # This step is necessary because the previous step may have updated package.json
        run: git checkout -- package.json packages/*/package.json
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps
        working-directory: ./packages/browser-sdk
      - id: build
        name: Build the project
        run: yarn build
      - name: Build docs
        run: yarn docs
      - id: test
        name: Test the project
        run: yarn test:ci
      - name: Check standalone examples
        run: |
          for example in packages/node-sdk/examples/cloudflare-worker packages/openfeature-node-provider/example; do
            (cd "$example" && yarn install --immutable && yarn npm audit --recursive --no-deprecations && yarn build && yarn test:ci)
          done
      - name: Check native development tooling
        run: |
          yarn workspace reflag-react-native-sdk-bare-rn react-native config > "$RUNNER_TEMP/native-config.json"
          yarn tsc --project packages/react-native-sdk/dev/bare-rn/tsconfig.json --noEmit
          yarn tsc --project packages/react-native-sdk/dev/expo/tsconfig.json --noEmit
          for platform in ios android; do
            yarn workspace reflag-react-native-sdk-bare-rn react-native bundle --platform "$platform" --dev false --entry-file index.js --bundle-output "$RUNNER_TEMP/bare-$platform.bundle" --assets-dest "$RUNNER_TEMP/bare-$platform-assets" --max-workers 2
            yarn workspace reflag-react-sdk-expo expo export --platform "$platform" --output-dir "$RUNNER_TEMP/expo-$platform" --max-workers 2
          done
      - name: Report test results
        uses: dorny/test-reporter@v1.6.0
        with:
          name: Build & Test Report
          path: ./packages/*/junit.xml
          reporter: jest-junit
      - id: fmt
        name: Check formatting
        run: yarn fmt
      - id: lint
        name: Check for linting errors
        run: yarn lint:ci
