name: Release packages

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the PAT for git operations so the release PR update can trigger CI.
          token: ${{ secrets.CHANGESETS_BOT_TOKEN }}
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"
          registry-url: "https://registry.npmjs.org"
          scope: "@reflag"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Create release PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          publish: yarn release-packages
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_BOT_TOKEN }}
      - name: Select released SDK documentation
        if: steps.changesets.outputs.published == 'true'
        id: docs
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/docs-release-plan.mjs "$RUNNER_TEMP/sdk-docs-plan.json"
      - name: Build docs
        if: steps.docs.outputs.has_docs == 'true'
        run: yarn docs
      - name: Checkout docs with SSH
        if: steps.docs.outputs.has_docs == 'true'
        uses: actions/checkout@v4
        with:
          repository: reflagcom/docs
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: reflag-docs
      # Land the docs repository's SDK importer before enabling this workflow.
      # That repository owns public paths/banners; SDK sources remain here.
      - name: Sync only released packages and majors
        if: steps.docs.outputs.has_docs == 'true'
        run: node reflag-docs/.github/scripts/sdk-docs.mjs release --source . --destination reflag-docs --plan "$RUNNER_TEMP/sdk-docs-plan.json"
      - name: Check generated documentation
        if: steps.docs.outputs.has_docs == 'true'
        working-directory: reflag-docs
        run: node .github/scripts/check-sdk-docs.mjs
      - name: Commit and push changes
        if: steps.docs.outputs.has_docs == 'true'
        working-directory: reflag-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@reflag.com"
          git add supported-languages legacy api sdk .generated/sdk-docs
          if ! git diff --cached --quiet; then
            git commit -m "Update released SDK documentation"
            git push
          fi
