name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable CLI version on maintenance/cli-v1
        required: true
        type: string
      dry_run:
        description: Build and check without publishing
        default: true
        type: boolean

# Serialize with the release workflow on main while checking and updating latest.
concurrency: npm-package-release

jobs:
  build-cli-v1:
    if: github.ref == 'refs/heads/maintenance/cli-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: node --test scripts/cli-v1-release.test.mjs
      - run: yarn workspace @reflag/cli test
      - run: yarn workspace @reflag/cli build
      - run: yarn workspace @reflag/cli pack --out "$RUNNER_TEMP/reflag-cli.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: reflag-cli
          path: ${{ runner.temp }}/reflag-cli.tgz
          if-no-files-found: error
          overwrite: true

  publish-cli-v1:
    needs: build-cli-v1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: reflag-cli
          path: ${{ runner.temp }}
      - name: Check the packaged CLI version and npm latest tag
        env:
          CLI_VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          tar -xOf "$RUNNER_TEMP/reflag-cli.tgz" package/package.json | node scripts/cli-v1-release.mjs
      - name: Publish CLI v1 to latest
        if: ${{ !inputs.dry_run }}
        run: npm publish "$RUNNER_TEMP/reflag-cli.tgz" --access public --tag latest --ignore-scripts
